name: CoreCraft Genesis Release Gate

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release Gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify runtime
        shell: pwsh
        run: |
          Write-Host "=== Node.js ==="
          node --version

          Write-Host "=== npm ==="
          npm --version

          Write-Host "=== Python ==="
          python --version

          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
              throw "Node.js is not available."
          }

          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
              throw "Python is not available."
          }

          Write-Host "[PASS] Runtime environment available."

      - name: Install Node dependencies
        shell: pwsh
        run: |
          npm ci

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          npx playwright install chromium

      - name: Site Link Audit
        shell: pwsh
        run: |
          $Script = Join-Path `
              $env:GITHUB_WORKSPACE `
              "Final-SiteLinkAudit.ps1"

          if (-not (Test-Path -LiteralPath $Script)) {
              throw "Final-SiteLinkAudit.ps1 not found."
          }

          $Command = Get-Command $Script

          if ($Command.Parameters.ContainsKey("RepositoryRoot")) {
              & $Script -RepositoryRoot $env:GITHUB_WORKSPACE
          }
          else {
              & $Script
          }

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: SEO Metadata Audit
        shell: pwsh
        run: |
          $Script = Join-Path `
              $env:GITHUB_WORKSPACE `
              "Final-SeoMetadataAudit.ps1"

          if (-not (Test-Path -LiteralPath $Script)) {
              throw "Final-SeoMetadataAudit.ps1 not found."
          }

          $Command = Get-Command $Script

          if ($Command.Parameters.ContainsKey("RepositoryRoot")) {
              & $Script -RepositoryRoot $env:GITHUB_WORKSPACE
          }
          else {
              & $Script
          }

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Performance and Accessibility Audit
        shell: pwsh
        run: |
          $Script = Join-Path `
              $env:GITHUB_WORKSPACE `
              "Final-PerformanceAccessibilityAudit.ps1"

          if (-not (Test-Path -LiteralPath $Script)) {
              throw "Final-PerformanceAccessibilityAudit.ps1 not found."
          }

          $Command = Get-Command $Script

          if ($Command.Parameters.ContainsKey("RepositoryRoot")) {
              & $Script -RepositoryRoot $env:GITHUB_WORKSPACE
          }
          else {
              & $Script
          }

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Start and verify local website server
        shell: pwsh
        run: |
          $Process = Start-Process `
              -FilePath "python" `
              -ArgumentList `
                  "-m", `
                  "http.server", `
                  "4173", `
                  "--bind", `
                  "127.0.0.1" `
              -WorkingDirectory $env:GITHUB_WORKSPACE `
              -PassThru

          Write-Host "Python server PID: $($Process.Id)"

          $Ready = $false

          for ($Attempt = 1; $Attempt -le 30; $Attempt++) {
              try {
                  $Response = Invoke-WebRequest `
                      -Uri "http://127.0.0.1:4173/" `
                      -UseBasicParsing `
                      -TimeoutSec 2

                  if ($Response.StatusCode -eq 200) {
                      $Ready = $true
                      Write-Host "[PASS] Local website server reachable."
                      break
                  }
              }
              catch {
                  Write-Host `
                      "Waiting for local server ($Attempt/30)..."

                  Start-Sleep -Seconds 1
              }
          }

          if (-not $Ready) {
              if (-not $Process.HasExited) {
                  Stop-Process `
                      -Id $Process.Id `
                      -Force `
                      -ErrorAction SilentlyContinue
              }

              throw `
                  "Local website server failed to start on port 4173."
          }

          "WEBSITE_SERVER_PID=$($Process.Id)" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      - name: Run Playwright acceptance tests
        shell: pwsh
        run: |
          npx playwright test `
              --config ".\playwright.config.js" `
              --workers=1

      - name: Stop local website server
        if: always()
        shell: pwsh
        run: |
          if ($env:WEBSITE_SERVER_PID) {
              $ServerProcess = Get-Process `
                  -Id $env:WEBSITE_SERVER_PID `
                  -ErrorAction SilentlyContinue

              if ($ServerProcess) {
                  Stop-Process `
                      -Id $env:WEBSITE_SERVER_PID `
                      -Force

                  Write-Host `
                      "[PASS] Local website server stopped."
              }
          }

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload audit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: audit-reports
          path: |
            seo-metadata-audit.json
            performance-accessibility-audit.json
          if-no-files-found: ignore
          retention-days: 14