name: CoreCraft Genesis Release Gate

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release Gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        shell: pwsh
        run: |
          npm ci

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          npx playwright install chromium

      - name: Site Link Audit
        shell: pwsh
        run: |
          $Script = Join-Path $env:GITHUB_WORKSPACE "Final-SiteLinkAudit.ps1"
          $Command = Get-Command $Script

          if ($Command.Parameters.ContainsKey("RepositoryRoot")) {
              & $Script -RepositoryRoot $env:GITHUB_WORKSPACE
          }
          else {
              & $Script
          }

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: SEO Metadata Audit
        shell: pwsh
        run: |
          $Script = Join-Path $env:GITHUB_WORKSPACE "Final-SeoMetadataAudit.ps1"
          $Command = Get-Command $Script

          if ($Command.Parameters.ContainsKey("RepositoryRoot")) {
              & $Script -RepositoryRoot $env:GITHUB_WORKSPACE
          }
          else {
              & $Script
          }

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Performance and Accessibility Audit
        shell: pwsh
        run: |
          $Script = Join-Path $env:GITHUB_WORKSPACE "Final-PerformanceAccessibilityAudit.ps1"
          $Command = Get-Command $Script

          if ($Command.Parameters.ContainsKey("RepositoryRoot")) {
              & $Script -RepositoryRoot $env:GITHUB_WORKSPACE
          }
          else {
              & $Script
          }

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Start local website server
        shell: pwsh
        run: |
          $Process = Start-Process `
              -FilePath "python" `
              -ArgumentList "-m", "http.server", "4173", "--bind", "127.0.0.1" `
              -WorkingDirectory $env:GITHUB_WORKSPACE `
              -PassThru

          "WEBSITE_SERVER_PID=$($Process.Id)" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          $Ready = $false

          for ($Attempt = 1; $Attempt -le 30; $Attempt++) {
              try {
                  $Response = Invoke-WebRequest `
                      -Uri "http://127.0.0.1:4173/" `
                      -UseBasicParsing `
                      -TimeoutSec 2

                  if ($Response.StatusCode -lt 400) {
                      $Ready = $true
                      break
                  }
              }
              catch {
                  Start-Sleep -Seconds 1
              }
          }

          if (-not $Ready) {
              throw "Local website server did not become ready on port 4173."
          }

      - name: Run Playwright acceptance tests
        shell: pwsh
        run: |
          npx playwright test `
            --config ".\playwright.config.js" `
            --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: audit-reports
          path: |
            seo-metadata-audit.json
            performance-accessibility-audit.json
          if-no-files-found: ignore
          retention-days: 14